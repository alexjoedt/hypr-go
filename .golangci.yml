version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  exclusions:
    rules:
      # Close on a read-only socket or a test server has nothing to report.
      - linters: [errcheck]
        source: '\.Close\(\)'

formatters:
  enable:
    - gofmt
    - goimports
